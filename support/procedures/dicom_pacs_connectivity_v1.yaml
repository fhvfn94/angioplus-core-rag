procedure_id: DICOM_PACS_CONNECTIVITY
version: 1
issue: "Подключение и передача данных DICOM на PACS: настройка и проверка соединения."
entry_step: CONFIGURE_DICOM_CONNECT
steps:
  - id: CONFIGURE_DICOM_CONNECT
    action: "Откройте DICOM Connect на панели инструментов PStation и укажите заголовок AE и номер порта (по умолчанию: μFR и порт 1108)."
    evidence_query: "dicom connect pstation панель инструментов заголовок ae номера порта 1108"
    transitions:
      attempted_failed: REGISTER_DESTINATION_NODE
      resolved: RESOLVED
  - id: REGISTER_DESTINATION_NODE
    action: "Зарегистрируйте сервер PStation для хранения SCP с заголовком AE и номером порта в PACS в качестве узла назначения DICOM."
    evidence_query: "зарегистрировать сервер pstation хранения scp заголовок ae номера порта pacs узел назначения dicom"
    transitions:
      attempted_failed: TEST_DICOM_NODE
      resolved: RESOLVED
  - id: TEST_DICOM_NODE
    action: "Добавьте узел DICOM и нажмите кнопку тестирования зарегистрированного узла DICOM, чтобы проверить соединение."
    evidence_query: "добавить узел dicom тестирования зарегистрированного узла соединение"
    transitions:
      attempted_failed: RESTART_SOFTWARE
      resolved: RESOLVED
  - id: RESTART_SOFTWARE
    action: "Перезапустите программное обеспечение AngioPlus Core и повторите проверку соединения."
    evidence_query: "перезапустите программное обеспечение angioplus core проверка соединения"
    transitions:
      attempted_failed: ESCALATE
      resolved: RESOLVED
terminators:
  - ESCALATE
  - RESOLVED
